name: macOS

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macos-latest
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install \
            qt@5 \
            glib \
            libxml2 \
            libpng \
            jpeg-turbo \
            assimp@5 \
            pkgconf \
            dylibbundler

      - name: Build
        shell: bash
        run: |
          qt_prefix="$(brew --prefix qt@5)"
          assimp_prefix="$(brew --prefix assimp@5)"
          glib_prefix="$(brew --prefix glib)"
          xml_prefix="$(brew --prefix libxml2)"
          png_prefix="$(brew --prefix libpng)"
          jpeg_prefix="$(brew --prefix jpeg-turbo)"

          export PATH="$qt_prefix/bin:$PATH"
          export PKG_CONFIG_PATH="$qt_prefix/lib/pkgconfig:$assimp_prefix/lib/pkgconfig:$glib_prefix/lib/pkgconfig:$xml_prefix/lib/pkgconfig:$png_prefix/lib/pkgconfig:$jpeg_prefix/lib/pkgconfig"

          make \
            CC=clang \
            CXX=clang++ \
            CPPFLAGS_JPEG="-I$jpeg_prefix/include" \
            LIBS_JPEG="-L$jpeg_prefix/lib -ljpeg" \
            DOWNLOAD_GAMEPACKS=no \
            DEPENDENCIES_CHECK=verbose \
            -j"$(sysctl -n hw.ncpu)"

      - name: Package and validate app bundle
        shell: bash
        run: |
          export QT_PREFIX="$(brew --prefix qt@5)"
          bash setup/apple/package.sh

          app="setup/apple/target/NetRadiant-Custom.app"
          test -x "$app/Contents/MacOS/radiant"
          test -f "$app/Contents/MacOS/gamepacks/games/mohaa.game"
          test -f "$app/Contents/MacOS/gamepacks/games/mohaas.game"
          test -f "$app/Contents/MacOS/gamepacks/games/mohaab.game"
          entities="$app/Contents/MacOS/gamepacks/mohaa.game/main/entities.def"
          test -f "$entities"
          test "$(grep -c '/\*QUAKED' "$entities")" -eq 96

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: NetRadiant-Custom-macOS-${{ runner.arch }}
          path: setup/apple/target/NetRadiant-Custom-macos-*.zip
          if-no-files-found: error
          retention-days: 14
